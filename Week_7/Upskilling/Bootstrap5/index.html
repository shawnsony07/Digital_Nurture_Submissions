<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bootstrap Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Portal</a>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="row align-items-center">
            <div class="col-md-3">Sidebar</div>
            <div class="col-md-9">
                <div class="card shadow-lg rounded-pill p-3 border-primary">
                    <h1 class="display-4 text-center">Hello Bootstrap</h1>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#myModal">Open Modal</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="myModal"><div class="modal-dialog"><div class="modal-content"><div class="modal-body">Modal!</div></div></div></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
